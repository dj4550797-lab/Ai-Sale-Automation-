services:
  - type: web
    name: flixora-sales-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask init-db && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_ENV
        value: production
  
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: TEST_MODE
        value: "true"
