<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#flixGrad)" />
  <g filter="url(#shadow)">
    <!-- Main stem -->
    <rect x="18" y="15" width="10" height="34" rx="2.5" fill="#ffffff" />
    <!-- Top bar -->
    <rect x="18" y="15" width="28" height="9" rx="2.5" fill="#ffffff" />
    <!-- Middle bar -->
    <rect x="18" y="28" width="20" height="8.5" rx="2.5" fill="#ffffff" />
    <!-- Modern tech dot accent -->
    <circle cx="50" cy="19.5" r="2.8" fill="#ffffff" />
  </g>
</svg>
