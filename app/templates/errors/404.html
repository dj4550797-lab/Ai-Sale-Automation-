{% extends "base.html" %}
{% block title %}Page Not Found — Flixora{% endblock %}
{% block page_title %}404{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <div class="empty-state">
            <span class="material-symbols-outlined empty-state-icon">search_off</span>
            <h3>Page Not Found</h3>
            <p>The page you're looking for doesn't exist or has been moved.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <span class="material-symbols-outlined">home</span>
                Go to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
