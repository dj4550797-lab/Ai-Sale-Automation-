{% extends "base.html" %}
{% block title %}Server Error — Flixora{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <div class="empty-state">
            <span class="material-symbols-outlined empty-state-icon">error</span>
            <h3>Something went wrong</h3>
            <p>An unexpected error occurred. Please try again or contact the administrator.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <span class="material-symbols-outlined">home</span>
                Go to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
